const selected=new Set(JSON.parse(localStorage.getItem('comfy:sel')||'[]'));
function render(){
  grid.innerHTML='';
  files.forEach(f=>{
    const isSel=selected.has(f);
    const div=document.createElement('div');
    div.className='card'+(isSel?' selected':'');
    div.innerHTML=`<img src="assets/comfy-output/${f}" loading="lazy"><div class="label">${f}</div><div class="check">✓</div>`;

}
function clearAll(){selected.clear();localStorage.removeItem('comfy:sel');render();}
async function addToGallery(){
  if(selected.size===0){alert('Sélectionne au moins 1');return;}
  const list=[...selected];
  // Sauve pour la galerie ShowMe5WH — les 2 clés pour compatibilité, showme5wh prioritaire
  localStorage.setItem('showme5wh:selection', JSON.stringify(list));
  localStorage.setItem('comfy:sel', JSON.stringify(list));
  // Pour GitHub Pages (besoin de vrais fichiers dans assets/showme5wh), on propose aussi les cp
  const cmds=list.map(f=>`cp "assets/comfy-output/${f}" "assets/showme5wh/${f}"`).join('\n');
  const go = confirm(list.length+' images sélectionnées — voir la galerie maintenant ?\n\nOK = ouvrir gallery-showme5wh.html (preview instantanée)\nAnnuler = juste copier les commandes cp pour Pages');

    window.open('gallery-showme5wh.html','_blank');
  } else {
    try{await navigator.clipboard.writeText(cmds); alert('Commandes cp copiées — colle dans ton terminal puis git add/push pour Pages');}catch{alert(cmds)}
  }
}
