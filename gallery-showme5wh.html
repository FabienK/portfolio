<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShowMe5WH — Galerie</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','system-ui'],display:['Instrument Serif','Georgia','serif']}}}}</script>
<style>body{background:#FDFBF7;color:#1A1A18;font-family:'Plus Jakarta Sans',system-ui,sans-serif}.display{font-family:'Instrument Serif',Georgia,serif}</style>
</head>
<body>
<nav class="max-w-[1200px] mx-auto px-4 pt-6 flex items-center justify-between">
  <a href="index.html" class="inline-flex items-center gap-2 bg-white border border-black/10 rounded-full px-4 py-2 text-[13px] font-semibold hover:bg-black/[0.04]">← Portfolio</a>
  <a href="https://github.com/FabienK/Image-generator" target="_blank" class="bg-white border border-black/10 rounded-full px-4 py-2 text-[12px] font-semibold">Image-generator ↗</a>
</nav>

<header class="max-w-[1200px] mx-auto px-4 pt-8 pb-6">
  <h1 class="display text-[32px] leading-[0.95] tracking-[-0.02em]">ShowMe5WH <span class="italic font-normal text-[#6B7280]">— Galerie</span></h1>
  <p class="text-[13px] text-[#6B7280] mt-3 max-w-[68ch] leading-relaxed">Galerie vitrine — 18 images sélectionnées · Flux schnell · 1216×832 → 2048×1400 · 300 DPI · ComfyUI M4. Clique pour agrandir.</p>
  <div class="flex flex-wrap gap-2 mt-4 text-[11px]">
    <span class="bg-[#1A1A18] text-white rounded-full px-3 py-1.5 font-semibold inline-flex items-center gap-1.5"><span class="size-2 rounded-full bg-emerald-400"></span> Flux schnell</span>
    <span class="bg-white border border-black/10 rounded-full px-3 py-1.5 font-semibold">300 DPI</span>
    <span class="bg-white border border-black/10 rounded-full px-3 py-1.5 font-semibold">18 photos</span>
  </div>
</header>

<main class="max-w-[1200px] mx-auto px-4 pb-16">
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  <p class="text-[11px] text-[#9CA3AF] text-center mt-8">Vitrine — on regarde, on ne touche pas · <a href="index.html" class="underline">retour portfolio</a></p>
</main>

<div id="lightbox" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-sm p-4 sm:p-8" onclick="closeLb()">
  <button class="absolute top-4 right-4 size-9 rounded-full bg-white/15 text-white grid place-items-center text-[18px]">×</button>
  <div class="h-full grid place-items-center" onclick="event.stopPropagation()">
    <img id="lb-img" src="" class="max-w-full max-h-[82vh] object-contain rounded-2xl shadow-2xl bg-white">
    <div id="lb-cap" class="text-white text-center mt-4 text-[13px]"></div>
  </div>
</div>

<script>
const images = [
  {file:"01-plongee.jpg", label:"Plongée", cat:"Perspective", src:"assets/showme5wh/01-plongee.jpg"},
  {file:"12-teleobjectif.jpg", label:"Téléobjectif", cat:"Perspective", src:"assets/showme5wh/12-teleobjectif.jpg"},
  {file:"18-trois-points.jpg", label:"Trois points de fuite", cat:"Perspective", src:"assets/showme5wh/18-trois-points.jpg"},
  {file:"02-photorealiste.jpg", label:"Photoréaliste", cat:"Style", src:"assets/showme5wh/02-photorealiste.jpg"},
  {file:"07-3d-render.jpg", label:"3D render", cat:"Style", src:"assets/showme5wh/07-3d-render.jpg"},
  {file:"09-cyberpunk.jpg", label:"Cyberpunk", cat:"Style", src:"assets/showme5wh/09-cyberpunk.jpg"},
  {file:"4w1h_00004_.png", label:"4W1H #04", cat:"ShowMe5WH", src:"assets/showme5wh/4w1h_00004_.png"},
  {file:"4w1h_00005_.png", label:"4W1H #05", cat:"ShowMe5WH", src:"assets/showme5wh/4w1h_00005_.png"},
  {file:"4w1h_00024_.png", label:"4W1H #24", cat:"ShowMe5WH", src:"assets/showme5wh/4w1h_00024_.png"},
  {file:"4w1h_00027_.png", label:"4W1H #27", cat:"ShowMe5WH", src:"assets/showme5wh/4w1h_00027_.png"},
  {file:"4w1h_00031_.png", label:"4W1H #31", cat:"ShowMe5WH", src:"assets/showme5wh/4w1h_00031_.png"},
  {file:"4w1h_00032_.png", label:"4W1H #32", cat:"ShowMe5WH", src:"assets/showme5wh/4w1h_00032_.png"},
  {file:"4w1h_00033_.png", label:"4W1H #33", cat:"ShowMe5WH", src:"assets/showme5wh/4w1h_00033_.png"},
  {file:"4w1h_00038_.png", label:"4W1H #38", cat:"ShowMe5WH", src:"assets/showme5wh/4w1h_00038_.png"},
  {file:"4w1h_00039_.png", label:"4W1H #39", cat:"ShowMe5WH", src:"assets/showme5wh/4w1h_00039_.png"},
  {file:"4w1h_00040_.png", label:"4W1H #40", cat:"ShowMe5WH", src:"assets/showme5wh/4w1h_00040_.png"},
  {file:"4w1h_00041_.png", label:"4W1H #41", cat:"ShowMe5WH", src:"assets/showme5wh/4w1h_00041_.png"},
  {file:"4w1h_00042_.png", label:"4W1H #42", cat:"ShowMe5WH", src:"assets/showme5wh/4w1h_00042_.png"},
];
const grid=document.getElementById('grid');
grid.innerHTML=images.map(img=>`
  <figure class="group bg-white border border-black/[0.06] rounded-[20px] overflow-hidden shadow-[0_8px_24px_rgba(0,0,0,0.04)] cursor-zoom-in" onclick="openLb('${img.file}')">
    <div class="aspect-[4/3] overflow-hidden bg-[#F3F4F6]">
      <img src="${img.src}" alt="${img.label}" loading="lazy" class="w-full h-full object-cover group-hover:scale-[1.02] transition duration-500">
    </div>
    <figcaption class="px-4 py-3 flex items-start justify-between gap-3">
      <div class="min-w-0"><div class="text-[13px] font-semibold truncate">${img.label}</div><div class="text-[11px] text-[#9CA3AF] truncate">${img.file}</div></div>
      <div class="shrink-0 flex flex-col items-end gap-1"><span class="text-[10px] font-bold tracking-widest uppercase bg-[#F3F4F6] rounded-full px-2.5 py-1">${img.cat}</span><span class="text-[10px] text-[#9CA3AF]">Flux schnell</span></div>
    </figcaption>
  </figure>`).join('');
function openLb(file){
  const img=images.find(x=>x.file===file);
  document.getElementById('lb-img').src=img.src;
  document.getElementById('lb-cap').innerHTML=`<b>${img.label}</b> · ${img.file} · <span class='opacity-60'>${img.cat}</span>`;
  document.getElementById('lightbox').classList.remove('hidden');
  document.body.style.overflow='hidden';
}
function closeLb(){ document.getElementById('lightbox').classList.add('hidden'); document.body.style.overflow=''; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLb(); });
</script>
</body>
</html>
